# Build + self-check on every push / PR. Deployment: .github/workflows/deploy.yml (GitHub Pages).
name: build

on:
  push:
    branches: [main, site-v2, site-2026-10]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro build
      - run: node scripts/contrast.mjs
      - run: node scripts/check.mjs
