# Build + self-check on every push / PR. Deployment is done by Cloudflare Pages, not here.
name: build

on:
  push:
    branches: [main, site-v2]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro build
      - run: node scripts/contrast.mjs
      - run: node scripts/check.mjs
